# Smithery configuration for Bsoft TMS
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_bsoft

name: bsoft-mcp
displayName: "Bsoft TMS"
description: >
  API oficial do Bsoft TMS, sistema líder de gestão de transportadoras do Brasil (Bsoft by nstech). Emissão e consulta de CT-e, MDF-e e NF-e, chaves de acesso, XML e PDF dos documentos fiscais, financeiro (títulos a pagar/receber, pagamentos, recebimentos, contratos, conciliação), frota e manutenção, fretes e conhecimentos, controle de viagens e cadastros de pessoas. Conecte com as credenciais do seu domínio Bsoft (domínio, usuário com perfil de integração e senha).

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/bsoft-mcp
repository: https://github.com/mcp-dir/bsoft-mcp

tags:
  - bsoft
  - brazil
  - logistics
  - vertical
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_bsoft

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_bsoft/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
